defaults:
  - ppo_base_config
  - _self_

data:
  train_data: ["data/skyrl/train.parquet"]
  val_data: ["data/skyrl/validation.parquet"]

trainer:
  strategy: fsdp2

  algorithm:
    advantage_estimator: "gae"
    use_kl_estimator_k3: true
    use_abs_kl: false
    use_kl_in_reward: false
    use_kl_loss: false
    kl_loss_coef: 0.001
    advantage_batch_normalize: false
    value_head_prefix: "value_head"
    ppo_loss_type: "regular"
    loss_reduction: "sequence_mean"
    lambd: 1.0
    gamma: 1.0
    eps_clip_low: 0.2
    eps_clip_high: 0.28
    clip_ratio_c: 3.0
    value_clip: 0.2
    normalize_reward: true

  policy:
    model:
      path: ${oc.env:AGENT_MODEL_PATH,models/default-instruct}
    optimizer_config:
      lr: 5.0e-7
      max_grad_norm: 1.0
      num_warmup_steps: 10
      weight_decay: 0.01
      offload_after_step: true
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: -1
    use_torch_compile: true
    sequence_parallel_size: 1

  ref:
    fsdp_config:
      cpu_offload: true
    policy:

  critic:
    model:
      path: ${oc.env:AGENT_MODEL_PATH,models/default-instruct}
    optimizer_config:
      lr: 1.0e-6
      max_grad_norm: 1.0
      num_warmup_steps: 10
      weight_decay: 0.01
      offload_after_step: true
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: -1
    use_torch_compile: true
    sequence_parallel_size: 1

  placement:
    policy_num_gpus_per_node: 1
    ref_num_gpus_per_node: 1
    critic_num_gpus_per_node: 1

  epochs: 5
  update_epochs_per_batch: 2
  train_batch_size: 4
  policy_mini_batch_size: 4
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  critic_mini_batch_size: 4
  update_ref_every_epoch: true
  max_prompt_length: 2048
  eval_batch_size: 16
  eval_before_train: true
  eval_interval: 10
  gradient_checkpointing: true
  seed: 42
  resume_mode: latest
  resume_path: null
  ckpt_path:
  max_ckpts_to_keep: 5
  ckpt_interval: 10
  hf_save_interval: 20
  export_path:
  project_name: "agent-exp-training"
  run_name: "agent-exp-ppo"
  logger: "wandb"

generator:
  model_dtype: "bfloat16"
  run_engines_locally: true
  num_inference_engines: 1
  backend: "vllm"
  weight_sync_backend: "nccl"
  inference_engine_tensor_parallel_size: 1
  n_samples_per_prompt: 4
  async_engine: true
  batched: false
  max_input_length: 8192
  enable_prefix_caching: true
  enable_chunked_prefill: true
  max_num_batched_tokens: 8192
  enforce_eager: false
  gpu_memory_utilization: 0.8
  max_num_seqs: 8
  max_turns: 16
  sampling_params:
    max_generate_length: 1024
    temperature: 0.7
    top_p: 1.0
    min_p: 0.0
    top_k: -1
  use_conversation_multi_turn: true
  apply_overlong_filtering: false
  eval_sampling_params:
    max_generate_length: 1024
    temperature: 0.0
    top_p: 1.0
    min_p: 0.0
    top_k: -1
  eval_n_samples_per_prompt: 1
  zero_reward_on_non_stop: false

environment:
  env_class: agent_worlds
  skyrl_gym:
    max_env_workers: 8
    agent_worlds:
      max_turns: 16
