[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-experience-worlds"
version = "0.1.0"
description = "Verifiable legal and finance environments for agent learning from tool-use experience."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Agent Experience Worlds contributors" }]

[project.scripts]
agent-exp = "agent_worlds.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8", "httpx>=0.27"]
train = ["datasets>=2.19", "hydra-core>=1.3", "omegaconf>=2.3", "pyarrow>=15", "ray>=2.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_worlds*"]

[tool.setuptools.package-data]
agent_worlds = [
  "worlds/**/*.sql",
  "worlds/**/*.jsonl",
  "worlds/contracts/documents/*.txt",
  "dashboard/*.html",
  "train/confs/*.yaml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
